[project]
name = "curl_cffi_patch"
version = "0.16.3"
authors = [{ name = "lexiforest", email = "infinitesheldon@gmail.com" }]
description = "libcurl ffi bindings for Python, with impersonation support."
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["cffi>=2.0.0", "certifi>=2024.2.2"]
readme = "README.md"
requires-python = ">=3.10"
urls = { "repository" = "https://github.com/Ehsan-U/curl-cffi-patch" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading",
]


[project.optional-dependencies]
extra = ["readability-lxml>=0.8.1", "markdownify>=1.1.0", "lxml_html_clean"]
cli = ["rich"]
dev = [
    "charset_normalizer>=3.3.2,<4.0",
    "coverage>=6.4.1,<7.0",
    "cryptography>=46.0.4,<47.0",
    "httpx==0.23.1",                  # don't change, tests will raise "httpx.InvalidURL: Invalid URL component 'path'"
    "pytest>=8.1.1,<9.0",
    "pytest-asyncio>=0.23.6,<1.0",
    "pytest-trio>=0.8.0,<1.0",
    "ruff>=0.3.5,<1.0",
    "trio>=0.25.0,<1.0",
    "trustme>=1.1.0,<2.0",
    "uvicorn>=0.29.0,<1.0",
    "websockets>=14.0",
    "typing_extensions",
]
build = ["cibuildwheel", "wheel"]
wheel-test = ["h2>=4.4.1,<5.0"]
integration = ["aioquic>=1.3.0,<2.0", "h2>=4.4.1,<5.0"]
test = [
    "charset_normalizer>=3.3.2,<4.0",
    "cryptography>=46.0.4,<47.0",
    "litestar>=2.19.0,<3.0",
    "httpx==0.23.1",                  # don't change, tests will raise "httpx.InvalidURL: Invalid URL component 'path'"
    "proxy.py>=2.4.3,<3.0",
    "pytest>=8.1.1,<9.0",
    "pytest-asyncio>=0.23.6,<1.0",
    "pytest-trio>=0.8.0,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "trio>=0.25.0,<1.0",
    "trustme>=1.1.0,<2.0",
    "uvicorn>=0.29.0,<1.0",
    "websockets>=14.0",
    "typing_extensions",
]

[project.scripts]
curl-cffi = "curl_cffi.cli:main"

[build-system]
requires = ["wheel", "setuptools", "cffi>=2.0.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools]
packages = ["curl_cffi", "curl_cffi.cli", "curl_cffi.requests"]
package-data = { curl_cffi = ["native_licenses/*"] }


[tool.cibuildwheel]
# abi3 serves CPython 3.10+; free-threaded CPython needs a separate wheel.
build = [
    "cp310-manylinux_x86_64", "cp310-manylinux_aarch64",
    "cp310-musllinux_x86_64", "cp310-musllinux_aarch64",
    "cp310-macosx_arm64",
    "cp314t-manylinux_x86_64", "cp314t-manylinux_aarch64",
    "cp314t-musllinux_x86_64", "cp314t-musllinux_aarch64",
    "cp314t-macosx_arm64",
]
before-all = "bash {package}/scripts/ci_build_native.sh"
environment = { IMPERSONATE_BUILD_DIR = "/tmp/curl-cffi-patch-native", IMPERSONATE_LINK_TYPE = "static" }
test-command = "python -bb -m pytest {project}/tests/unittest {project}/tests/wheel"
test-extras = ["test", "wheel-test"]
build-verbosity = 1

[tool.cibuildwheel.linux]
archs = ["auto64"]
manylinux-x86_64-image = "manylinux2014"
manylinux-aarch64-image = "manylinux2014"

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { IMPERSONATE_BUILD_DIR = "/tmp/curl-cffi-patch-native", IMPERSONATE_LINK_TYPE = "static", MACOSX_DEPLOYMENT_TARGET = "11.0" }


[tool.pytest.ini_options]
# pythonpath = [ "." ]
asyncio_mode = "auto"


[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "UP007",
    "UP045", # X | None
]

[tool.isort]
profile = "black"
line_length = 88
