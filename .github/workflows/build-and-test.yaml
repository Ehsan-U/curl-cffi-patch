name: Build and test
on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: wheels-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          python-version: "3.11"
      - name: Build sdist without a host-specific native library
        run: uv build --sdist
        env:
          CURL_CFFI_BUILD_SDIST: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: curl_cffi-${{ github.sha }}-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  bdist:
    name: Patched wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          python-version: "3.11"
      - name: Install macOS native build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja make automake libtool
      - name: Build and test installed wheels with patched native libraries
        uses: pypa/cibuildwheel@v3.3.1
      - name: Verify HTTP/2 and HTTP/3 from the installed abi3 wheel
        run: |
          uv venv --python 3.11 "$RUNNER_TEMP/profile-wheel-test"
          uv run --no-project python scripts/test_installed_wheel.py wheelhouse "$RUNNER_TEMP/profile-wheel-test"
      - uses: actions/upload-artifact@v4
        with:
          name: curl_cffi-${{ github.sha }}-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error
